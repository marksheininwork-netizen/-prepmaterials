 fever","Improved energy","Stable vital signs","Reduced pallor"],["Which action is appropriate first for a suspected transfusion reaction?","Stop the transfusion","Increase the infusion rate","Discard all documentation","Continue until the bag empties"],["Which electrolyte abnormality is associated with peaked T waves?","Hyperkalemia","Hypocalcemia","Hyponatremia","Hypophosphatemia"],["Which assessment is essential before administering digoxin?","Apical pulse","Visual acuity","Abdominal circumference","Pupil size"],["Which finding indicates possible lithium toxicity?","New coarse tremor and ataxia","Improved concentration","Stable appetite","Normal gait"],["Which action is appropriate when a sterile field becomes wet through its barrier?","Replace the contaminated field","Cover it with a dry towel","Continue using the field","Dry it with a fan"],["Which patient finding requires urgent stroke evaluation?","Sudden facial droop and arm weakness","Chronic knee stiffness","Gradual hair loss","Longstanding tinnitus"],["Which finding suggests deep vein thrombosis?","New unilateral leg swelling","Symmetric dry skin","Bilateral mild itching","Chronic finger stiffness"],["Which action helps prevent pressure injuries?","Regular repositioning and offloading","Massage persistent redness","Use a heating pad on bony areas","Keep damp linens in place"],["Which assessment best reflects immediate respiratory status?","Respiratory effort and oxygen saturation","Daily weight","Bowel sounds","Skin turgor alone"],["Which finding is characteristic of fluid volume deficit?","Orthostatic hypotension","Jugular venous distention","Pulmonary edema","Bounding peripheral pulses"],["Which task is generally appropriate to delegate to trained assistive personnel for a stable patient?","Measure routine vital signs","Perform initial nursing assessment","Develop the nursing care plan","Evaluate medication effectiveness"],["Which action protects a patient's confidentiality?","Discuss care privately wit
