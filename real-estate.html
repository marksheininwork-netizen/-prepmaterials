<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real Estate | Prep Materials</title><link rel="stylesheet" href="style.css"><body><header><a href="index.html">Prep Materials</a></header><main><a href="index.html">← All exams</a><h1>Real Estate</h1><p>Starter practice set · 2 questions</p><form id="exam"></form><p id="result" role="status"></p><button id="retry" hidden>Retake exam</button></main><footer>Independent original practice questions. Not official exam content. Educational use only.</footer><script>const questions=[["What is a fiduciary duty owed by an agent to a client?","Loyalty","Guaranteed profit","Free financing","Property ownership"],["What document generally transfers title to real property?","Deed","Listing advertisement","Inspection report","Rental application"]];const form=document.getElementById('exam'),result=document.getElementById('result'),retry=document.getElementById('retry');questions.forEach((q,i)=>{const f=document.createElement('fieldset');const l=document.createElement('legend');l.textContent=(i+1)+'. '+q[0];f.append(l);q.slice(1).map((a,j)=>({a,j})).sort(()=>Math.random()-.5).forEach(({a,j})=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;input.required=true;label.append(input,' '+a);f.append(label)});form.append(f)});const submit=document.createElement('button');submit.textContent='Submit exam';form.append(submit);form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);let score=0;const review=questions.map((q,i)=>{const ok=d.get('q'+i)==='0';if(ok)score++;return (i+1)+'. '+(ok?'Correct':'Incorrect')+' — '+q[1]});result.textContent='Score: '+score+'/'+questions.length+' ('+Math.round(score/questions.length*100)+'%)\n'+review.join('\n');form.querySelectorAll('input,button').forEach(x=>x.disabled=true);retry.hidden=false;result.scrollIntoView()};retry.onclick=()=>location.reload();</script></body></html>
